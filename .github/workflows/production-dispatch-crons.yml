name: Production dispatch crons

on:
  schedule:
    # Every 10 minutes (was */5). Still Hobby-safe on GitHub; halves Vercel Fluid CPU
    # from dispatch invocations while keeping orphan/favorite retry timely for launch.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: production-dispatch-crons
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-crons:
    runs-on: ubuntu-latest
    # Six cron endpoints × retries need headroom beyond 5 minutes.
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://www.mmddelivery.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Validate cron configuration
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Missing GitHub repository secret CRON_SECRET. Sync it from Vercel production (see scripts/sync-github-cron-secret.mjs)."
            exit 1
          fi
          echo "CRON_SECRET is configured (length ${#CRON_SECRET})."
          echo "SITE_URL=${SITE_URL}"

      - name: Run production dispatch crons
        run: node scripts/run-production-dispatch-crons.mjs
