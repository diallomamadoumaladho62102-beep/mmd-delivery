name: Production finance cron

# Hourly finance ledger posting (was every 5 minutes via dispatch crons — too heavy for Hobby Fluid CPU).
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: production-finance-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finance-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://www.mmddelivery.com' }}
      CRON_FETCH_TIMEOUT_MS: "90000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate cron configuration
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Missing GitHub repository secret CRON_SECRET."
            exit 1
          fi
          echo "CRON_SECRET configured (length ${#CRON_SECRET})."
          echo "SITE_URL=${SITE_URL}"

      - name: Run process-finance cron
        run: node scripts/run-production-finance-cron.mjs
