name: Production driver integrity cron

on:
  schedule:
    # GitHub Actions shortest supported interval is 5 minutes.
    # Business thresholds stay in Admin; the scan uses server timestamps.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: production-driver-integrity-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  driver-integrity-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://www.mmddelivery.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Validate cron configuration
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Missing GitHub repository secret CRON_SECRET."
            exit 1
          fi
          echo "CRON_SECRET is configured (length ${#CRON_SECRET})."
          echo "SITE_URL=${SITE_URL}"

      - name: Run driver integrity scan
        run: node scripts/run-production-driver-integrity-cron.mjs
