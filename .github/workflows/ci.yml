name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the workspace pnpm used to generate pnpm-lock.yaml (lockfileVersion 9.0).
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove metro 0.83.8 removed image-size (Expo 54 / Apple #121 intact)
        run: node scripts/image-size-clean-install.regression.test.mjs

      - name: Verify Snyk inflight ignore policy scope
        run: node scripts/snyk-inflight-policy.regression.test.mjs

      - name: Audit payment reconcile regressions
        run: node apps/web/src/lib/payoutExecutionBridge.reconcile.regression.test.mjs && node apps/web/src/lib/finance/bankPayoutLedgerBridge.regression.test.mjs && node apps/web/src/lib/finance/processPayoutsWeekly.regression.test.mjs && node apps/web/src/lib/marketplaceLiveCheckoutIdempotency.regression.test.mjs && node apps/web/src/lib/stripeWebhookGuards.regression.test.mjs && node apps/mobile/scripts/mobileClientTimeout.regression.test.mjs && node apps/web/src/lib/finance/moneySplitIdentity.regression.test.mjs && node apps/web/src/lib/finance/zeroMmdSctHold.regression.test.mjs && node apps/web/src/lib/finance/optionABPartnerEarnings.regression.test.mjs && pnpm --dir apps/web exec tsx src/lib/finance/driverConnectBankPayout.test.ts && pnpm --dir apps/mobile exec tsx src/lib/instantCashoutBlockMessage.test.ts

      - name: Typecheck web
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Typecheck mobile
        run: pnpm --dir apps/mobile exec tsc --noEmit

      - name: Verify migration files
        run: node scripts/verify-migration-files.mjs

      - name: Verify profiles signup role guard
        run: node scripts/verify-profiles-signup-role-guard.mjs

      - name: Cron HTTP evaluator unit test
        run: node scripts/evaluateCronHttpResult.test.mjs

      - name: Secret scan
        run: node scripts/secret-scan.mjs

      - name: Dependency audit (high/critical)
        run: node scripts/dependency-audit.mjs

      - name: Security layer files
        run: node scripts/security-layers.regression.test.mjs

      - name: Lint
        run: pnpm --dir apps/mobile lint && pnpm --dir apps/web lint

      - name: Web build
        run: pnpm --dir apps/web build

      - name: Web security tests
        run: pnpm --dir apps/web test:security

      - name: Web critical tests
        run: pnpm --dir apps/web test:ci

      - name: Mobile i18n coverage
        run: pnpm --dir apps/mobile test:i18n-coverage && pnpm --dir apps/mobile test:i18n-hardcoded

      - name: Mobile maps tests
        run: pnpm --dir apps/mobile test:maps

      - name: Mobile navigation tests
        run: pnpm --dir apps/mobile test:navigation

      - name: Web Mapbox places parse tests
        run: pnpm --dir apps/web test:maps-places-parse

      - name: MMD AI tests
        run: pnpm --dir apps/web test:mmd-ai
