name: OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: zap-baseline-local
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm

      - name: Install and build web
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web build

      - name: Start Next.js and run ZAP baseline
        env:
          ZAP_TARGET: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          echo "ZAP job started target=${ZAP_TARGET}"
          pnpm --dir apps/web start --hostname 127.0.0.1 --port 3000 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "health_check=ok Next.js ready on 127.0.0.1:3000"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "health_check=failed Next.js did not become ready on 127.0.0.1:3000"
              exit 1
            fi
            sleep 2
          done
          echo "ZAP scan starting against ${ZAP_TARGET}"
          node scripts/owasp-zap-baseline.mjs
          echo "ZAP scan finished"
